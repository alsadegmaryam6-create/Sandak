name: Build Signed AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip Daleel_Android_GitHubActions_API36.zip -d android-project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-project/daleel-release.jks

      - name: Build signed AAB
        env:
          DALEEL_KEYSTORE_PATH: ${{ github.workspace }}/android-project/daleel-release.jks
          DALEEL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DALEEL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DALEEL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle -p android-project bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Daleel-AAB
          path: android-project/app/build/outputs/bundle/release/app-release.aab
