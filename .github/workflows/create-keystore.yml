name: Create Daleel Keystore and AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair             -v             -keystore daleel-release.jks             -storetype JKS             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEY_PASSWORD"             -alias "$KEY_ALIAS"             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Daleel, OU=Daleel, O=Daleel, L=Port Sudan, ST=Red Sea, C=SD"

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list             -keystore daleel-release.jks             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS" > /dev/null
          echo "Keystore verified."

      - name: Unzip Daleel Android project
        run: |
          rm -rf daleel_android
          mkdir daleel_android
          unzip -q "Daleel_Android_GitHubActions_API36.zip" -d daleel_android
          ls -la daleel_android

      - name: Build Signed AAB
        working-directory: daleel_android
        env:
          DALEEL_KEYSTORE_PATH: ${{ github.workspace }}/daleel-release.jks
          DALEEL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DALEEL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DALEEL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Upload AAB and signing-key backup
        uses: actions/upload-artifact@v4
        with:
          name: Daleel-Release-Package
          path: |
            daleel_android/app/build/outputs/bundle/release/app-release.aab
            daleel-release.jks
          if-no-files-found: error
          retention-days: 30
